id: R2-AHPC-2026-09-26
title: Audit History Provenance Causal Binding
status: IMPLEMENTED_PENDING_RUNTIME_VERIFICATION
contract:
  invariants:
    - "AuditChain length == accepted History length == Provenance length"
    - "AuditRecord.transition_hash binds the exact TransitionRecord"
    - "AuditRecord.provenance_hash binds the exact Provenance"
    - "Audit predecessor hash forms an independent append-only audit chain"
    - "Missing, reordered, or tampered audit evidence fails closed"
  separation:
    - "History records semantic transitions"
    - "Provenance explains authorization/evidence context"
    - "Audit records verify the causal relationship between them"
  causal_relation: "History + Provenance -> bound Audit evidence; Audit evidence cannot create a transition"
architecture:
  module: core/audit_chain.py
  integration_target: canonical commit path
tests:
  - tests/test_audit_chain.py::test_audit_chain_verifies_against_history_and_provenance
  - tests/test_audit_chain.py::test_audit_chain_rejects_transition_tampering
  - tests/test_audit_chain.py::test_audit_chain_rejects_provenance_tampering
  - tests/test_audit_chain.py::test_audit_chain_rejects_missing_audit_event
pending:
  - "bind AuditChain creation directly into commit_once"
  - "durable audit persistence"
  - "replay audit verification"
  - "CI runtime verification"
